<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<main class = "card">
    <h1>Create account</h1>
    <p class = "subtitle">Join us in gordist rayona</p>
    <form id = "register-form">
        <div class = "field">
            <label>Name</label>
            <input type = "text" id = "username" autocomplete = "username" placeholder = "fe Nadiia">
            <small id = "username-error" class = "error"></small>
        </div>
        <div class = "field">
            <label>email</label>
            <input type = "email" id = "email" autocomplete = "email" placeholder = "abc@example.com">
            <small id = "email-error" class = "error"></small>
        </div>
        <div class = "field">
            <label>password</label>
            <div class="password-row">
                <input type = "password" id = "password" autocomplete = "username" placeholder = "not less than 8" required>
                <button id = "toggle-password" class = "toggle" type = "button">👁️</button>
            </div>
            <small id = "password-error" class = "error"></small>
            <div class = "strangth-tack"><div id = "strength-bar"></div></div>
            <small id = "strength-text">Nadiynist of password</small>
        </div>
        <div class = "field">
            <label>Repeat the password</label>
            <input type = "password" id = "confirm-password" placeholder = "Repeat the password">
            <small id = "confirm-error" class = "error"></small>
        </div>
        <div class = "field">
            <label class = "terms"><input id = "terms" type = "checkbox" required>I agree...</label>
            <small id = "terms-error" class = "error"></small>
        </div>
        <button class = "submit" type = "submit">Registr</button>
        <p id = "result"></p>
    </form>
</main>
</body>
</html>
